name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imagecategorizer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - run: flet pack -n imagecategorizer main.py
        # `-n` documented for Windows exe; fallback rename guards naming drift
        # until first tag proves the output name.
      - name: Rename output
        shell: bash
        run: |
          [ -f dist/imagecategorizer.exe ] || cp "$(find dist -maxdepth 1 -type f | head -1)" dist/imagecategorizer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/imagecategorizer.exe

  release-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - run: flet pack -n imagecategorizer main.py
      - name: Build AppImage
        run: |
          APPDIR=imagecategorizer.AppDir
          mkdir -p "$APPDIR/usr/bin"
          if [ ! -f dist/imagecategorizer ]; then
            first=$(find dist -maxdepth 1 -type f ! -name "*.exe" | head -1)
            cp "$first" dist/imagecategorizer
          fi
          cp dist/imagecategorizer "$APPDIR/usr/bin/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          exec "$(dirname "$(readlink -f "$0")")/usr/bin/imagecategorizer" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/imagecategorizer.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Image Categorizer
          Exec=usr/bin/imagecategorizer
          Icon=imagecategorizer
          Categories=Graphics;
          EOF
          python - <<'EOF'
          from PIL import Image
          img = Image.new("RGB", (128, 128), (200, 60, 60))
          img.save("imagecategorizer.AppDir/imagecategorizer.png")
          EOF
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" ImageCategorizer-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: ImageCategorizer-x86_64.AppImage

  github-release:
    needs: [build-wheels, release-exe, release-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/exe/imagecategorizer.exe
            artifacts/appimage/ImageCategorizer-x86_64.AppImage
            artifacts/wheels/*
